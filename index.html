<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6d28d9">
  <meta name="description" content="ゆかりん専用 Nurse Quest Life OS">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>Nurse Quest Life OS</title>
</head>
<body>
  <header class="topbar">
    <div>
      <small id="todayLabel"></small>
      <h1>Nurse Quest <span>Life OS</span></h1>
    </div>
    <button class="icon-btn" id="syncBtn" aria-label="同期">↻</button>
  </header>

  <main>
    <section class="hero card">
      <div>
        <p class="eyebrow">おはよう、ゆかりん</p>
        <h2 id="secretaryMessage">今日は最低ラインだけでも100点。</h2>
      </div>
      <div class="level">
        <b>Lv.<span id="level">1</span></b>
        <div class="bar"><i id="expBar"></i></div>
        <small><span id="exp">0</span> EXP</small>
      </div>
    </section>

    <section class="quick-grid">
      <button class="quick" data-open="missionModal"><span>🎯</span>ミッション追加</button>
      <button class="quick" data-open="expenseModal"><span>💰</span>支出入力</button>
      <button class="quick" data-open="studyModal"><span>📚</span>課題追加</button>
      <button class="quick" data-open="healthModal"><span>❤️</span>体調入力</button>
    </section>

    <section class="card">
      <div class="section-title">
        <h3>今日のミッション</h3>
        <button id="aiPlanBtn" class="small-btn">AIに決めてもらう</button>
      </div>
      <div id="missionList" class="list"></div>
      <p id="missionEmpty" class="empty">まだミッションがありません。</p>
    </section>

    <section class="stats-grid">
      <article class="card stat">
        <small>今月の支出</small>
        <strong id="monthExpense">¥0</strong>
      </article>
      <article class="card stat">
        <small>未完了の課題</small>
        <strong id="taskCount">0件</strong>
      </article>
      <article class="card stat">
        <small>今日の家事</small>
        <strong id="choreCount">0件</strong>
      </article>
      <article class="card stat">
        <small>今日のHP</small>
        <strong id="hpValue">80%</strong>
      </article>
    </section>

    <section class="card">
      <div class="section-title"><h3>家計簿</h3><button data-open="expenseModal" class="small-btn">追加</button></div>
      <div id="expenseList" class="list compact"></div>
      <p id="expenseEmpty" class="empty">今日の支出はまだありません。</p>
    </section>

    <section class="card">
      <div class="section-title"><h3>課題・勉強</h3><button data-open="studyModal" class="small-btn">追加</button></div>
      <div id="taskList" class="list compact"></div>
      <p id="taskEmpty" class="empty">登録中の課題はありません。</p>
    </section>

    <section class="card">
      <div class="section-title"><h3>今日の献立</h3><button id="mealShuffleBtn" class="small-btn">候補変更</button></div>
      <div class="meal">
        <span>🍚</span>
        <div><b id="mealTitle">豚しゃぶ</b><small id="mealNote">無理な日は買って帰ってOK</small></div>
      </div>
    </section>

    <section class="card settings-preview">
      <div class="section-title"><h3>連携状況</h3><button data-open="settingsModal" class="small-btn">設定</button></div>
      <p id="connectionStatus">この端末に保存中</p>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="active" data-scroll="top">🏠<small>ホーム</small></button>
    <button data-open="missionModal">🎯<small>ミッション</small></button>
    <button data-open="expenseModal">💰<small>家計簿</small></button>
    <button data-open="studyModal">📚<small>学校</small></button>
    <button data-open="settingsModal">⚙️<small>設定</small></button>
  </nav>

  <dialog id="missionModal"><form method="dialog" class="modal-form">
    <div class="modal-head"><h3>ミッション追加</h3><button value="cancel">×</button></div>
    <label>種類<select id="missionType"><option>勉強</option><option>家事</option><option>健康</option><option>食事</option><option>仕事</option><option>休息</option><option>生活</option></select></label>
    <label>やること<input id="missionTitle" placeholder="例：心理学を20分"></label>
    <label>最低ライン<input id="missionMinimum" placeholder="例：教科書を開くだけ"></label>
    <label>EXP<input id="missionExp" type="number" value="10" min="1"></label>
    <button type="button" class="primary" id="saveMission">追加する</button>
  </form></dialog>

  <dialog id="expenseModal"><form method="dialog" class="modal-form">
    <div class="modal-head"><h3>支出を入力</h3><button value="cancel">×</button></div>
    <label>日付<input id="expenseDate" type="date"></label>
    <label>金額<input id="expenseAmount" type="number" inputmode="numeric" placeholder="980"></label>
    <label>カテゴリ<select id="expenseCategory"><option>食費</option><option>外食</option><option>日用品</option><option>交通</option><option>学校</option><option>娯楽</option><option>医療</option><option>美容</option><option>固定費</option><option>その他</option></select></label>
    <label>内容・お店<input id="expenseTitle" placeholder="コンビニ、ドラッグストアなど"></label>
    <label>支払方法<select id="expenseMethod"><option>PayPay</option><option>現金</option><option>クレジット</option><option>交通系IC</option><option>口座振替</option><option>その他</option></select></label>
    <button type="button" class="primary" id="saveExpense">保存する</button>
  </form></dialog>

  <dialog id="studyModal"><form method="dialog" class="modal-form">
    <div class="modal-head"><h3>課題を追加</h3><button value="cancel">×</button></div>
    <label>科目<input id="taskSubject" placeholder="心理学"></label>
    <label>課題・試験<input id="taskTitle" placeholder="第1回レポート"></label>
    <label>期限<input id="taskDeadline" type="date"></label>
    <label>目安時間（分）<input id="taskMinutes" type="number" value="30"></label>
    <button type="button" class="primary" id="saveTask">追加する</button>
  </form></dialog>

  <dialog id="healthModal"><form method="dialog" class="modal-form">
    <div class="modal-head"><h3>体調を入力</h3><button value="cancel">×</button></div>
    <label>HP・元気度（0〜100）<input id="healthHp" type="range" min="0" max="100" value="80"><output id="hpOutput">80</output></label>
    <label>睡眠時間<input id="healthSleep" type="number" step="0.5" placeholder="6.5"></label>
    <label>体重（任意）<input id="healthWeight" type="number" step="0.1" placeholder="74.0"></label>
    <label>メモ<textarea id="healthMemo" placeholder="頭痛、疲れ、生理など"></textarea></label>
    <button type="button" class="primary" id="saveHealth">保存する</button>
  </form></dialog>

  <dialog id="settingsModal"><form method="dialog" class="modal-form">
    <div class="modal-head"><h3>設定・同期</h3><button value="cancel">×</button></div>
    <label>Apps Script WebアプリURL<input id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec"></label>
    <label>同期用パスコード<input id="syncKey" type="password" placeholder="自分で決めた文字列"></label>
    <button type="button" class="primary" id="saveSettings">設定を保存</button>
    <button type="button" class="secondary" id="exportBtn">バックアップを書き出す</button>
    <label class="file-label">バックアップを読み込む<input id="importInput" type="file" accept=".json"></label>
    <button type="button" class="danger" id="resetBtn">データを初期化</button>
  </form></dialog>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
